<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01-03 아이디 찾기 · prepay-app</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<link rel="stylesheet" href="../../assets/preview.css">
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;font-family:'Noto Sans KR',sans-serif;color:#191F28;display:flex;flex-direction:column;overflow:hidden;position:relative">

<header style="flex:none;height:56px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 4px">
<a href="01-02-login.html" aria-label="뒤로 가기" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#191F28"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="position:absolute;left:60px;right:60px;margin:0;text-align:center;font-size:17px;font-weight:700">계정 찾기</h1>
<span style="width:44px;height:44px;display:block"></span>
</header>

<nav aria-label="계정 찾기 방법" style="flex:none;margin:0 20px;display:flex;border-bottom:1px solid #E5E8EB">
<a href="01-03-find-id.html" aria-current="page" style="flex:1;height:48px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#191F28;border-bottom:2px solid #191F28;margin-bottom:-1px">아이디 찾기</a>
<a href="01-05-find-pw.html" style="flex:1;height:48px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;color:#636D7A">비밀번호 찾기</a>
</nav>

<main style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column">
<h2 style="margin:0;padding:28px 20px 28px;font-size:24px;line-height:1.4;font-weight:700">가입할 때 쓴 정보로<br>아이디를 찾아요</h2>

<form style="margin:0;padding:0 20px;display:flex;flex-direction:column;gap:24px">
<div style="display:flex;flex-direction:column;gap:8px">
<span id="type-l" style="font-size:14px;font-weight:500;color:#4E5968">회원 유형</span>
<div role="group" aria-labelledby="type-l" style="display:flex;background:#F2F4F6;border-radius:12px;padding:4px">
<button type="button" aria-pressed="true" style="flex:1;height:40px;border:0;border-radius:9px;background:#FFFFFF;font-family:inherit;font-size:15px;font-weight:700;color:#191F28;cursor:pointer">개인</button>
<button type="button" aria-pressed="false" style="flex:1;height:40px;border:0;border-radius:9px;background:transparent;font-family:inherit;font-size:15px;font-weight:500;color:#4E5968;cursor:pointer">법인</button>
</div>
</div>

<label style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:14px;font-weight:500;color:#4E5968">이름 *</span>
<input type="text" autocomplete="name" value="김하나" required style="height:52px;box-sizing:border-box;border:1.5px solid #191F28;border-radius:14px;background:#FFFFFF;padding:0 16px;font-family:inherit;font-size:16px;color:#191F28;outline:none">
</label>

<label style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:14px;font-weight:500;color:#4E5968">휴대폰 번호 *</span>
<input type="tel" inputmode="numeric" autocomplete="tel" placeholder="숫자만 입력해 주세요" required style="height:52px;box-sizing:border-box;border:1.5px solid transparent;border-radius:14px;background:#F2F4F6;padding:0 16px;font-family:inherit;font-size:16px;color:#191F28;outline:none">
</label>
</form>

<p style="margin:20px 20px 0;display:flex;gap:6px;font-size:13px;line-height:1.5;color:#636D7A"><svg style="flex:none;margin-top:1px" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8h.01"/></svg>가입할 때 등록한 이름과 휴대폰 번호를 입력해 주세요</p>
</main>

<div style="flex:none;padding:12px 20px 34px;background:#FFFFFF">
<a href="01-04-find-id-result.html" style="height:56px;border-radius:16px;background:#DA2F2E;color:#FFFFFF;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center">아이디 찾기</a>
</div>
</div>
</body>
</html>
