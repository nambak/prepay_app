<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01-05 비밀번호 찾기 · prepay-app</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<link rel="stylesheet" href="../../assets/preview.css">
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;font-family:'Noto Sans KR',sans-serif;color:#191F28;display:flex;flex-direction:column;overflow:hidden;position:relative">

<header style="flex:none;height:56px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 4px">
<a href="01-02-login.html" aria-label="뒤로 가기" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#191F28"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="position:absolute;left:60px;right:60px;margin:0;text-align:center;font-size:17px;font-weight:700">계정 찾기</h1>
<span style="width:44px;height:44px;display:block"></span>
</header>

<nav aria-label="계정 찾기 방법" style="flex:none;margin:0 20px;display:flex;border-bottom:1px solid #E5E8EB">
<a href="01-03-find-id.html" style="flex:1;height:48px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;color:#636D7A">아이디 찾기</a>
<a href="01-05-find-pw.html" aria-current="page" style="flex:1;height:48px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#191F28;border-bottom:2px solid #191F28;margin-bottom:-1px">비밀번호 찾기</a>
</nav>

<main style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column">
<h2 style="margin:0;padding:28px 20px 12px;font-size:24px;line-height:1.4;font-weight:700">가입한 아이디를<br>입력해 주세요</h2>
<p style="margin:0;padding:0 20px 28px;font-size:14px;line-height:1.6;color:#4E5968">휴대폰 본인인증 후 비밀번호를 바꿀 수 있어요. 법인 계정은 가입할 때 등록한 담당자 휴대폰으로 인증해 주세요.</p>

<form style="margin:0;padding:0 20px;display:flex;flex-direction:column">
<label style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:14px;font-weight:500;color:#4E5968">이메일 아이디 *</span>
<input type="email" autocomplete="username" placeholder="hana@email.com" required style="height:52px;box-sizing:border-box;border:1.5px solid transparent;border-radius:14px;background:#F2F4F6;padding:0 16px;font-family:inherit;font-size:16px;color:#191F28;outline:none">
</label>
</form>

<section aria-labelledby="corp-t" style="margin:28px 20px 0;background:#F2F4F6;border-radius:16px;padding:16px;display:flex;align-items:flex-start;gap:12px">
<span style="flex:none;width:40px;height:40px;border-radius:20px;background:#FFFFFF;color:#4E5968;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V5h9v15M14 9h5v11M3 20h18M8 8.5h3M8 12h3M8 15.5h3"/></svg></span>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
<h3 id="corp-t" style="margin:0;font-size:15px;font-weight:700">법인 계정 담당자가 바뀌었나요?</h3>
<span style="font-size:13px;line-height:1.5;color:#636D7A">휴대폰 인증이 어려우면 따로 문의해 주세요</span>
<a href="#" style="align-self:flex-start;min-height:36px;margin-top:2px;display:flex;align-items:center;gap:2px;font-size:14px;font-weight:500;color:#191F28">법인 계정 문의하기<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#636D7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
</div>
</section>
</main>

<div style="flex:none;padding:12px 20px 34px;background:#FFFFFF">
<a href="01-06-reset-pw.html" style="height:56px;border-radius:16px;background:#DA2F2E;color:#FFFFFF;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center">휴대폰 인증하기</a>
</div>
</div>
</body>
</html>
