a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<link rel="stylesheet" href="../../assets/preview.css">
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;font-family:'Noto Sans KR',sans-serif;color:#191F28;display:flex;flex-direction:column;overflow:hidden;position:relative">

<header style="flex:none;height:56px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 4px">
<a href="08-01-groups.html" aria-label="닫기" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#191F28"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<h1 style="position:absolute;left:60px;right:60px;margin:0;text-align:center;font-size:17px;font-weight:700">그룹 만들기</h1>
<span style="width:44px;height:44px;display:block"></span>
</header>

<main style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column">

<div style="padding:8px 20px 20px;display:flex;flex-direction:column;gap:8px">
<div aria-hidden="true" style="display:flex;gap:4px">
<span style="flex:1;height:4px;border-radius:2px;background:#191F28;display:block"></span>
<span style="flex:1;height:4px;border-radius:2px;background:#191F28;display:block"></span>
<span style="flex:1;height:4px;border-radius:2px;background:#E5E8EB;display:block"></span>
</div>
<span style="font-size:13px;font-weight:500;color:#636D7A"><b style="color:#191F28;font-weight:700">2</b>/3 그룹 관계</span>
</div>

<h2 style="margin:0;padding:8px 20px 28px;font-size:24px;line-height:1.4;font-weight:700">그룹원과는<br>어떤 사이인가요?</h2>

<div style="padding:0 20px;display:flex;flex-direction:column;gap:24px">
<div role="group" aria-label="그룹 관계" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<button type="button" aria-pressed="false" style="height:56px;border:0;border-radius:16px;background:#F2F4F6;font-family:inherit;font-size:16px;font-weight:500;color:#191F28;cursor:pointer">가족</button>
<button type="button" aria-pressed="false" style="height:56px;border:0;border-radius:16px;background:#F2F4F6;font-family:inherit;font-size:16px;font-weight:500;color:#191F28;cursor:pointer">연인</button>
<button type="button" aria-pressed="false" style="height:56px;border:0;border-radius:16px;background:#F2F4F6;font-family:inherit;font-size:16px;font-weight:500;color:#191F28;cursor:pointer">친구</button>
<button type="button" aria-pressed="true" style="height:56px;border:0;border-radius:16px;background:#191F28;font-family:inherit;font-size:16px;font-weight:700;color:#FFFFFF;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>회사/팀</button>
<button type="button" aria-pressed="false" style="height:56px;border:0;border-radius:16px;background:#F2F4F6;font-family:inherit;font-size:16px;font-weight:500;color:#191F28;cursor:pointer">학교/동아리</button>
<button type="button" aria-pressed="false" style="height:56px;border:0;border-radius:16px;background:#F2F4F6;font-family:inherit;font-size:16px;font-weight:500;color:#191F28;cursor:pointer">동호회</button>
<button type="button" aria-pressed="false" style="height:56px;border:0;border-radius:16px;background:#F2F4F6;font-family:inherit;font-size:16px;font-weight:500;color:#191F28;cursor:pointer">친목</button>
<button type="button" aria-pressed="false" style="height:56px;border:0;border-radius:16px;background:#F2F4F6;font-family:inherit;font-size:16px;font-weight:500;color:#191F28;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>직접 입력</button>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<label style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:14px;font-weight:500;color:#8B95A1">직접 입력</span>
<input type="text" placeholder="최대 10자" maxlength="10" disabled style="height:52px;box-sizing:border-box;border:1.5px solid transparent;border-radius:14px;background:#F2F4F6;padding:0 16px;font-family:inherit;font-size:16px;color:#8B95A1;outline:none">
</label>
<span style="font-size:13px;color:#636D7A">'직접 입력'을 고르면 관계 이름을 쓸 수 있어요</span>
</div>
</div>
</main>

<div style="flex:none;padding:12px 20px 34px;background:#FFFFFF">
