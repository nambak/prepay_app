# CodeRabbit 리뷰 규칙. CLAUDE.md는 git에 올라가지 않아서, 리뷰에 필요한 규칙만 여기에 옮겨 적는다.
reviews:
  path_instructions:
    - path: "server/database/migrations/**"
      instructions: |
        오픈 전이라 운영 DB가 없어요. 오픈 전까지는 기존 테이블을 바꿀 때 새 마이그레이션을 만들지 않고,
        기존 파일을 고친 뒤 `php artisan migrate:fresh --seed`로 개발 DB를 다시 만들어요.
        기존 마이그레이션 파일을 고쳤다는 이유로 새 마이그레이션을 만들라고 지적하지 마세요.
        새 테이블은 새 파일로 만들어요. 오픈한 뒤에는 바뀐 내용도 새 마이그레이션으로 추가해요.
    - path: "**"
      instructions: |
        - 대괄호 값(`[N]`, `[운영사명]`, `[고객센터 이메일]` 등)은 아직 정하지 않은 정책 값을 일부러 남긴 자리표시예요.
          실제 값으로 바꾸라고 지적하지 말고, docs/auth-design.md 9장이나 docs/point-design.md 7장의
          '아직 정할 것'에 적혀 있는지 확인해 주세요.
        - 용어: 상표 문제로 '단골', '머니', '모임'은 쓰지 않아요. '캐시'도 개발 용어 cache와 헷갈려서 쓰지 않아요.
          잔액은 '포인트'(충전포인트·공유포인트·서비스포인트), 모임은 '그룹/그룹장/그룹원'이에요. 코드 이름도 point예요.
        - 단위: 잔액·포인트는 `P`(예: 50,000P), 실제로 내는 돈은 `원`이에요. 포인트를 원으로, 결제 금액을 P로 적으면 지적해 주세요.
        - 사용자에게 보이는 문구는 해요체로 짧게 써요.
