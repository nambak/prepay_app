<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<link rel="stylesheet" href="../../assets/preview.css">
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;font-family:'Noto Sans KR',sans-serif;color:#191F28;display:flex;flex-direction:column;overflow:hidden;position:relative">

<header style="flex:none;height:56px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 4px">
<a href="01-08-join-terms.html" aria-label="뒤로 가기" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#191F28"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="position:absolute;left:60px;right:60px;margin:0;text-align:center;font-size:17px;font-weight:700">회원가입</h1>
<span style="width:44px;height:44px;display:block"></span>
</header>

<div style="flex:none;padding:4px 20px 0;display:flex;flex-direction:column;gap:8px">
<div aria-hidden="true" style="display:flex;gap:4px">
<span style="flex:1;height:4px;border-radius:2px;background:#191F28;display:block"></span>
<span style="flex:1;height:4px;border-radius:2px;background:#191F28;display:block"></span>
<span style="flex:1;height:4px;border-radius:2px;background:#E5E8EB;display:block"></span>
</div>
<span style="font-size:13px;font-weight:500;color:#4E5968">2/3 본인인증</span>
</div>

<main style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column">
<h2 style="margin:0;padding:20px 20px 28px;font-size:24px;line-height:1.4;font-weight:700">본인인증을<br>진행해 주세요</h2>

<section aria-labelledby="verify-t" style="margin:0 20px;background:#F2F4F6;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;align-items:center;gap:12px">
<span style="flex:none;width:44px;height:44px;border-radius:22px;background:#FFFFFF;color:#191F28;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></span>
<h3 id="verify-t" style="margin:0;font-size:17px;font-weight:700">휴대폰 본인인증</h3>
</div>
<ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px">
<li style="display:flex;align-items:flex-start;gap:8px;font-size:15px;line-height:1.5;color:#191F28"><svg style="flex:none;margin-top:3px;color:#2C7445" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>휴대폰으로 이름과 생년월일을 확인해요</li>
<li style="display:flex;align-items:flex-start;gap:8px;font-size:15px;line-height:1.5;color:#191F28"><svg style="flex:none;margin-top:3px;color:#2C7445" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>이미 가입한 계정이 있으면 알려 드려요</li>
<li style="display:flex;align-items:flex-start;gap:8px;font-size:15px;line-height:1.5;color:#191F28"><svg style="flex:none;margin-top:3px;color:#2C7445" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>만 14세 미만이면 보호자 인증이 이어져요</li>
</ul>
</section>

<p style="margin:16px 24px 0;font-size:13px;line-height:1.5;color:#636D7A">인증한 정보는 본인 확인에만 쓰고, 다른 곳에 쓰지 않아요.</p>
</main>

<div style="flex:none;padding:12px 20px 34px;background:#FFFFFF">
<a href="01-10-join-info.html" style="height:56px;border-radius:16px;background:#DA2F2E;color:#FFFFFF;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center">휴대폰으로 본인인증</a>
</div>
</div>

</html>
