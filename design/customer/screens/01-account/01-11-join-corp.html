<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01-11 법인 정보 입력 · prepay-app</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<link rel="stylesheet" href="../../assets/preview.css">
</head>
<body>
<div style="width:390px;height:1060px;box-sizing:border-box;background:#FFFFFF;font-family:'Noto Sans KR',sans-serif;color:#191F28;display:flex;flex-direction:column;overflow:hidden;position:relative">

<header style="flex:none;height:56px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 4px">
<a href="01-07-join-type.html" aria-label="뒤로 가기" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#191F28"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="position:absolute;left:60px;right:60px;margin:0;text-align:center;font-size:17px;font-weight:700">법인 회원가입</h1>
<span style="width:44px;height:44px;display:block"></span>
</header>

<main style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column">
<h2 style="margin:0;padding:8px 20px 24px;font-size:24px;line-height:1.4;font-weight:700">법인 정보를<br>입력해 주세요</h2>

<form style="margin:0;padding:0 20px;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;flex-direction:column;gap:8px">
<label for="corp-no" style="font-size:14px;font-weight:500;color:#4E5968">사업자등록번호 *</label>
<div style="height:52px;box-sizing:border-box;border:1.5px solid transparent;border-radius:14px;background:#F2F4F6;padding:0 6px 0 16px;display:flex;align-items:center;gap:8px">
<input id="corp-no" type="text" inputmode="numeric" value="1234567890" required style="flex:1;min-width:0;height:100%;border:0;background:transparent;padding:0;font-family:inherit;font-size:16px;color:#191F28;outline:none;font-variant-numeric:tabular-nums">
<button type="button" style="flex:none;height:40px;border:0;border-radius:10px;background:#191F28;color:#FFFFFF;font-family:inherit;font-size:14px;font-weight:500;padding:0 14px;cursor:pointer">인증</button>
</div>
<span style="display:flex;align-items:center;gap:4px;font-size:13px;color:#2C7445"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>사업자 번호가 확인됐어요</span>
</div>

<label style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:14px;font-weight:500;color:#4E5968">상호명 *</span>
<input type="text" autocomplete="organization" placeholder="사업자등록증의 상호를 입력해 주세요" required style="height:52px;box-sizing:border-box;border:1.5px solid transparent;border-radius:14px;background:#F2F4F6;padding:0 16px;font-family:inherit;font-size:16px;color:#191F28;outline:none">
</label>

<label style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:14px;font-weight:500;color:#4E5968">대표자명 *</span>
<input type="text" placeholder="사업자등록증의 대표자명" required style="height:52px;box-sizing:border-box;border:1.5px solid transparent;border-radius:14px;background:#F2F4F6;padding:0 16px;font-family:inherit;font-size:16px;color:#191F28;outline:none">
</label>

<div style="display:flex;flex-direction:column;gap:8px">
<label for="corp-addr" style="font-size:14px;font-weight:500;color:#4E5968">사업자 주소 *</label>
<div style="height:52px;box-sizing:border-box;border:1.5px solid transparent;border-radius:14px;background:#F2F4F6;padding:0 6px 0 16px;display:flex;align-items:center;gap:8px">
<input id="corp-addr" type="text" readonly placeholder="주소를 검색해 주세요" required style="flex:1;min-width:0;height:100%;border:0;background:transparent;padding:0;font-family:inherit;font-size:16px;color:#191F28;outline:none">
<button type="button" style="flex:none;height:40px;border:0;border-radius:10px;background:#191F28;color:#FFFFFF;font-family:inherit;font-size:14px;font-weight:500;padding:0 14px;cursor:pointer">검색</button>
</div>
<label style="display:flex;flex-direction:column">
<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">상세 주소</span>
<input type="text" placeholder="상세 주소" style="height:52px;box-sizing:border-box;border:1.5px solid transparent;border-radius:14px;background:#F2F4F6;padding:0 16px;font-family:inherit;font-size:16px;color:#191F28;outline:none">
</label>
</div>

<label style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:14px;font-weight:500;color:#4E5968">담당자 이름 *</span>
<input type="text" autocomplete="name" placeholder="대표 관리자의 실명" required style="height:52px;box-sizing:border-box;border:1.5px solid transparent;border-radius:14px;background:#F2F4F6;padding:0 16px;font-family:inherit;font-size:16px;color:#191F28;outline:none">
</label>

<div style="display:flex;flex-direction:column;gap:8px">
<label for="corp-tel" style="font-size:14px;font-weight:500;color:#4E5968">담당자 연락처 *</label>
<div style="height:52px;box-sizing:border-box;border:1.5px solid transparent;border-radius:14px;background:#F2F4F6;padding:0 6px 0 16px;display:flex;align-items:center;gap:8px">
<input id="corp-tel" type="tel" inputmode="numeric" autocomplete="tel" placeholder="숫자만 입력해 주세요" required style="flex:1;min-width:0;height:100%;border:0;background:transparent;padding:0;font-family:inherit;font-size:16px;color:#191F28;outline:none">
<button type="button" style="flex:none;height:40px;border:0;border-radius:10px;background:#191F28;color:#FFFFFF;font-family:inherit;font-size:14px;font-weight:500;padding:0 14px;cursor:pointer">인증</button>
</div>
</div>
</form>

<section aria-label="법인 가입 안내" style="margin:24px 20px 0;background:#F2F4F6;border-radius:16px;padding:16px">
<ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.55;color:#4E5968">
<li style="display:flex;gap:8px"><span aria-hidden="true" style="flex:none;width:4px;height:4px;border-radius:2px;background:#8B95A1;margin-top:8px;display:block"></span><span>하나의 사업자 번호로 여러 계정을 만들 수 있어요.</span></li>
<li style="display:flex;gap:8px"><span aria-hidden="true" style="flex:none;width:4px;height:4px;border-radius:2px;background:#8B95A1;margin-top:8px;display:block"></span><span>사업자 정보를 도용해 가입하거나 결제하면 법적 조치를 받을 수 있어요. (형법 제232조의2, 제234조)</span></li>
</ul>
</section>
</main>

<div style="flex:none;padding:12px 20px 34px;background:#FFFFFF">
<a href="01-12-join-done.html" style="height:56px;border-radius:16px;background:#DA2F2E;color:#FFFFFF;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center">가입 신청하기</a>
</div>
</div>
</body>
</html>
