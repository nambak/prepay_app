<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01-02 로그인 · prepay-app</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>

a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<link rel="stylesheet" href="../../assets/preview.css">
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;font-family:'Noto Sans KR',sans-serif;color:#191F28;display:flex;flex-direction:column;overflow:hidden;position:relative;padding-top:24px">

<main style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column">
<h1 style="margin:0;padding:8px 20px 28px;font-size:24px;line-height:1.4;font-weight:700">즐겨찾는 가게에<br>로그인해 주세요</h1>

<form style="margin:0;padding:0 20px;display:flex;flex-direction:column;gap:16px">
<label style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:14px;font-weight:500;color:#4E5968">이메일 아이디</span>
<input type="email" autocomplete="username" placeholder="hana@email.com" style="height:52px;box-sizing:border-box;border:1.5px solid transparent;border-radius:14px;background:#F2F4F6;padding:0 16px;font-family:inherit;font-size:16px;color:#191F28;outline:none">
</label>
<label style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:14px;font-weight:500;color:#4E5968">비밀번호</span>
<input type="password" autocomplete="current-password" placeholder="비밀번호를 입력해 주세요" style="height:52px;box-sizing:border-box;border:1.5px solid transparent;border-radius:14px;background:#F2F4F6;padding:0 16px;font-family:inherit;font-size:16px;color:#191F28;outline:none">
</label>
<a href="../02-home/02-01-home.html" style="margin-top:8px;height:56px;border-radius:16px;background:#DA2F2E;color:#FFFFFF;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center">로그인</a>
</form>

<nav aria-label="계정 찾기" style="margin-top:8px;display:flex;align-items:center;justify-content:center;gap:4px">
<a href="01-03-find-id.html" style="height:44px;padding:0 10px;display:flex;align-items:center;font-size:14px;color:#4E5968">아이디 찾기</a>
<span aria-hidden="true" style="width:1px;height:12px;background:#E5E8EB;display:block"></span>
<a href="01-05-find-pw.html" style="height:44px;padding:0 10px;display:flex;align-items:center;font-size:14px;color:#4E5968">비밀번호 찾기</a>
</nav>

<section aria-labelledby="sns-t" style="margin-top:28px;padding:0 20px;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;align-items:center;gap:12px">
<span aria-hidden="true" style="flex:1;height:1px;background:#E5E8EB;display:block"></span>
<h2 id="sns-t" style="margin:0;font-size:13px;font-weight:500;color:#636D7A">또는 SNS로 로그인</h2>
<span aria-hidden="true" style="flex:1;height:1px;background:#E5E8EB;display:block"></span>
</div>
<div style="display:flex;justify-content:center;gap:16px;padding-top:30px">
<a href="../02-home/02-01-home.html" aria-label="네이버로 로그인" style="width:48px;height:48px;border-radius:24px;background:#03C75A;color:#FFFFFF;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center">N</a>
<div style="position:relative">
<span style="position:absolute;left:50%;top:-31px;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:500;line-height:1.4;color:#FFFFFF;background:#191F28;border-radius:6px;padding:3px 7px">최근 로그인<span aria-hidden="true" style="position:absolute;left:50%;bottom:-3px;width:6px;height:6px;margin-left:-3px;background:#191F28;transform:rotate(45deg);display:block"></span></span>
<a href="../02-home/02-01-home.html" aria-label="카카오로 로그인 (최근 로그인)" style="width:48px;height:48px;border-radius:24px;background:#FEE500;color:#191919;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center">K</a>
</div>
<a href="../02-home/02-01-home.html" aria-label="페이스북으로 로그인" style="width:48px;height:48px;border-radius:24px;background:#1877F2;color:#FFFFFF;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center">f</a>
<a href="../02-home/02-01-home.html" aria-label="애플로 로그인" style="width:48px;height:48px;border-radius:24px;background:#191F28;color:#FFFFFF;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center">A</a>
<a href="../02-home/02-01-home.html" aria-label="구글로 로그인" style="width:48px;height:48px;box-sizing:border-box;border-radius:24px;border:1px solid #E5E8EB;background:#FFFFFF;color:#191F28;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center">G</a>
</div>
</section>
</main>

<div style="flex:none;padding:12px 20px 34px;background:#FFFFFF">

<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
<span style="font-size:15px;font-weight:700">처음이세요?</span>
<span style="font-size:13px;line-height:1.5;color:#4E5968">회원가입하고 지금 방문한 가게에서 바로 할인받아 보세요</span>
</div>
<a href="01-07-join-type.html" style="flex:none;height:44px;border-radius:12px;background:#FFFFFF;color:#191F28;font-size:14px;font-weight:500;padding:0 16px;display:flex;align-items:center;justify-content:center">회원가입</a>
</section>
</div>
</div>
