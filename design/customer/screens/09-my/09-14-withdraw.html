<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>09-14 회원 탈퇴 · prepay-app</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<link rel="stylesheet" href="../../assets/preview.css">
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;font-family:'Noto Sans KR',sans-serif;color:#191F28;display:flex;flex-direction:column;overflow:hidden;position:relative">

<header style="flex:none;height:56px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 4px">
<a href="09-08-profile.html" aria-label="뒤로 가기" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#191F28"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="position:absolute;left:60px;right:60px;margin:0;text-align:center;font-size:17px;font-weight:700">회원 탈퇴</h1>
<span style="width:44px;height:44px;display:block"></span>
</header>

<main style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column">
<h2 style="flex:none;margin:0;padding:8px 20px 24px;font-size:24px;line-height:1.4;font-weight:700">탈퇴하면 남은 포인트가<br>모두 사라져요</h2>

<section aria-label="남은 포인트" style="flex:none;margin:0 20px;background:#F2F4F6;border-radius:20px;padding:20px 16px 4px;display:flex;flex-direction:column">
<span style="font-size:14px;color:#4E5968">남은 포인트</span>
<div style="display:flex;align-items:baseline;gap:6px;margin:2px 0 8px">
<span style="font-size:32px;font-weight:700;letter-spacing:-0.8px;font-variant-numeric:tabular-nums">500,000</span>
<span style="font-size:18px;font-weight:700">P</span>
</div>
<div style="height:44px;display:flex;align-items:center;gap:10px;font-size:15px">
<span style="width:8px;height:8px;border-radius:4px;background:#EE3E3D;display:block"></span><span style="flex:1">충전포인트</span><span style="font-weight:700;font-variant-numeric:tabular-nums">320,000</span>
</div>
<div style="height:44px;display:flex;align-items:center;gap:10px;font-size:15px;border-top:1px solid #E5E8EB">
<span style="width:8px;height:8px;border-radius:4px;background:#6E5DA8;display:block"></span><span style="flex:1">공유포인트</span><span style="font-weight:700;font-variant-numeric:tabular-nums">150,000</span>
</div>
<div style="height:44px;display:flex;align-items:center;gap:10px;font-size:15px;border-top:1px solid #E5E8EB">
<span style="width:8px;height:8px;border-radius:4px;background:#F2A14A;display:block"></span><span style="flex:1">서비스포인트</span><span style="font-weight:700;font-variant-numeric:tabular-nums">30,000</span>
</div>
</section>

<section aria-labelledby="sec-refund" style="flex:none;margin:16px 20px 0;display:flex;align-items:center;gap:12px">
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<h3 id="sec-refund" style="margin:0;font-size:15px;font-weight:700">충전포인트는 환불받을 수 있어요</h3>
<span style="font-size:13px;color:#636D7A">탈퇴하기 전에 환불을 신청해 주세요</span>
</div>
<a href="../07-point-history/07-05-refund-apply.html" style="flex:none;height:44px;border-radius:12px;background:#F2F4F6;padding:0 16px;font-size:14px;font-weight:500;display:flex;align-items:center">환불 신청</a>
</section>

<ul style="flex:none;margin:24px 20px 0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.55;color:#4E5968;word-break:keep-all">
<li>사라진 포인트는 다시 가입해도 돌아오지 않아요.</li>
<li>결제 기록은 관련 법에 따라 [N]년 동안 보관한 뒤 지워요.</li>
<li>탈퇴하면 모든 기기에서 로그아웃돼요.</li>
</ul>

<label style="flex:none;margin:auto 20px 0;display:flex;align-items:flex-start;gap:12px;padding:12px 0;font-size:15px;font-weight:700;line-height:1.5;word-break:keep-all"><input type="checkbox" checked style="flex:none;width:22px;height:22px;margin:0;accent-color:#191F28">남은 포인트가 사라지는 것을 확인했고, 탈퇴에 동의해요</label>
</main>

<div style="flex:none;padding:12px 20px 34px;background:#FFFFFF;display:flex;gap:8px">
<a href="09-08-profile.html" style="flex:1;height:56px;border-radius:16px;background:#F2F4F6;color:#191F28;font-size:17px;font-weight:500;display:flex;align-items:center;justify-content:center">취소</a>
<a href="../01-account/01-02-login.html" style="flex:2;height:56px;border-radius:16px;background:#DA2F2E;color:#FFFFFF;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center">탈퇴하기</a>
</div>
</div>
