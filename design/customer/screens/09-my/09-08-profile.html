<div style="width:390px;height:1360px;box-sizing:border-box;background:#FFFFFF;font-family:'Noto Sans KR',sans-serif;color:#191F28;display:flex;flex-direction:column;overflow:hidden;position:relative">

<header style="flex:none;height:56px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 4px">
<a href="09-01-my.html" aria-label="뒤로 가기" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#191F28"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="position:absolute;left:60px;right:60px;margin:0;text-align:center;font-size:17px;font-weight:700">회원정보 수정</h1>

<main style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:0 0 24px">

<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:13px;color:#636D7A">아이디</span><span style="font-size:16px">hana@email.com</span></div>
<button type="button" aria-label="아이디 변경" style="flex:none;height:36px;border:0;border-radius:10px;background:#F2F4F6;padding:0 14px;font-family:inherit;font-size:14px;font-weight:500;color:#191F28;cursor:pointer">변경</button>
</div>
<div style="min-height:56px;display:flex;align-items:center;gap:12px;border-top:1px solid #F2F4F6">
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:13px;color:#636D7A">비밀번호</span><span style="font-size:16px;letter-spacing:2px">••••••••</span></div>
<a href="../01-account/01-06-reset-pw.html" aria-label="비밀번호 변경" style="flex:none;height:36px;border-radius:10px;background:#F2F4F6;padding:0 14px;font-size:14px;font-weight:500;color:#191F28;display:flex;align-items:center">변경</a>
</div>
</section>

<section aria-labelledby="sec-sns" style="flex:none;padding:24px 20px 0;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;flex-direction:column;gap:4px">
<h2 id="sec-sns" style="margin:0;font-size:18px;font-weight:700">SNS 연결</h2>
<span style="font-size:14px;color:#636D7A">연결된 SNS 계정이 없어요</span>
</div>
<div style="display:flex;gap:12px">
<button type="button" aria-label="네이버 연결" style="width:44px;height:44px;border:0;border-radius:22px;background:#03C75A;padding:0;font-family:inherit;font-size:16px;font-weight:700;color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer">N</button>
<button type="button" aria-label="카카오 연결" style="width:44px;height:44px;border:0;border-radius:22px;background:#FEE500;padding:0;font-family:inherit;font-size:16px;font-weight:700;color:#191919;display:flex;align-items:center;justify-content:center;cursor:pointer">K</button>
<button type="button" aria-label="페이스북 연결" style="width:44px;height:44px;border:0;border-radius:22px;background:#1877F2;padding:0;font-family:inherit;font-size:17px;font-weight:700;color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer">f</button>
<button type="button" aria-label="애플 연결" style="width:44px;height:44px;border:0;border-radius:22px;background:#191F28;padding:0;font-family:inherit;font-size:16px;font-weight:700;color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer">A</button>
<button type="button" aria-label="구글 연결" style="width:44px;height:44px;box-sizing:border-box;border:1px solid #E5E8EB;border-radius:22px;background:#FFFFFF;padding:0;font-family:inherit;font-size:16px;font-weight:700;color:#191F28;display:flex;align-items:center;justify-content:center;cursor:pointer">G</button>
</div>
</section>

<section aria-labelledby="sec-info" style="flex:none;padding:32px 20px 0;display:flex;flex-direction:column;gap:16px">

<label style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:14px;font-weight:500;color:#4E5968">이름</span>
<input type="text" value="김하나" readonly style="height:52px;box-sizing:border-box;border:1.5px solid transparent;border-radius:14px;background:#F2F4F6;padding:0 16px;font-family:inherit;font-size:16px;color:#4E5968;outline:none">
</label>
<label style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:14px;font-weight:500;color:#4E5968">생년월일</span>
<input type="text" value="2000.01.01" readonly style="height:52px;box-sizing:border-box;border:1.5px solid transparent;border-radius:14px;background:#F2F4F6;padding:0 16px;font-family:inherit;font-size:16px;color:#4E5968;outline:none;font-variant-numeric:tabular-nums">
</label>
<div style="display:flex;flex-direction:column;gap:8px">

<button type="button" aria-pressed="true" style="flex:1;height:40px;border:0;border-radius:9px;background:#FFFFFF;font-family:inherit;font-size:15px;font-weight:700;color:#191F28;cursor:pointer">남</button>
<button type="button" aria-pressed="false" style="flex:1;height:40px;border:0;border-radius:9px;background:transparent;font-family:inherit;font-size:15px;font-weight:500;color:#4E5968;cursor:pointer">여</button>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<label for="f-phone" style="font-size:14px;font-weight:500;color:#4E5968">연락처</label>
<div style="height:52px;box-sizing:border-box;border:1.5px solid transparent;border-radius:14px;background:#F2F4F6;padding:0 6px 0 16px;display:flex;align-items:center;gap:8px">
<input id="f-phone" type="tel" value="010-1234-5678" style="flex:1;min-width:0;border:0;background:transparent;font-family:inherit;font-size:16px;color:#191F28;outline:none;font-variant-numeric:tabular-nums">
<button type="button" aria-label="연락처 변경" style="flex:none;height:40px;border:0;border-radius:10px;background:#191F28;padding:0 14px;font-family:inherit;font-size:14px;font-weight:500;color:#FFFFFF;cursor:pointer">변경</button>
</div>
</div>
</section>

<section aria-labelledby="sec-bank" style="flex:none;padding:32px 20px 0;display:flex;flex-direction:column;gap:16px">

</div>
<label style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:14px;font-weight:500;color:#4E5968">계좌번호</span>
<input type="text" inputmode="numeric" placeholder="숫자만 입력해 주세요" style="height:52px;box-sizing:border-box;border:1.5px solid transparent;border-radius:14px;background:#F2F4F6;padding:0 16px;font-family:inherit;font-size:16px;color:#191F28;outline:none">
</label>
<label style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:14px;font-weight:500;color:#4E5968">예금주</span>

</label>
<span style="font-size:13px;color:#636D7A;margin-top:-6px">환불받을 때 이 계좌로 보내 드려요</span>

<section aria-labelledby="sec-ad" style="flex:none;padding:32px 20px 0;display:flex;flex-direction:column;gap:4px">

<label style="display:flex;align-items:center;gap:12px;min-height:44px;font-size:16px;font-weight:700"><input type="checkbox" style="width:22px;height:22px;margin:0;accent-color:#191F28">전체 동의</label>
<div style="padding-left:34px;display:flex;gap:24px">
<label style="display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px"><input type="checkbox" checked style="width:20px;height:20px;margin:0;accent-color:#191F28">SMS</label>
<label style="display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px"><input type="checkbox" style="width:20px;height:20px;margin:0;accent-color:#191F28">이메일</label>
</div>
<ul style="margin:8px 0 0;background:#F2F4F6;border-radius:16px;padding:14px 14px 14px 32px;display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:1.55;color:#4E5968">
<li>서비스 중요 안내와 결제·가게 이용 정보는 수신 동의와 관계없이 보내 드려요.</li>
<li>앱 푸시 알림은 내 정보 › 환경설정에서 바꿀 수 있어요.</li>
</ul>
<a href="09-14-withdraw.html" style="align-self:flex-start;margin-top:20px;min-height:44px;display:flex;align-items:center;font-size:13px;color:#636D7A;text-decoration:underline">회원 탈퇴</a>

<div style="flex:none;padding:12px 20px 34px;background:#FFFFFF">
<button type="button" style="height:56px;width:100%;border:0;border-radius:16px;background:#DA2F2E;color:#FFFFFF;font-family:inherit;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer">저장하기</button>
</div>
