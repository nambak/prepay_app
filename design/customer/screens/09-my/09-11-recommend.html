<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09-11 가게 추천 · prepay-app</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<link rel="stylesheet" href="../../assets/preview.css">
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;font-family:'Noto Sans KR',sans-serif;color:#191F28;display:flex;flex-direction:column;overflow:hidden;position:relative">

<header style="flex:none;height:56px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 4px">
<a href="09-01-my.html" aria-label="뒤로 가기" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#191F28"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="position:absolute;left:60px;right:60px;margin:0;text-align:center;font-size:17px;font-weight:700">가게 추천</h1>
<span style="width:44px;height:44px;display:block"></span>
</header>

<main style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:8px 20px 16px">

<h2 style="flex:none;margin:0;font-size:22px;line-height:1.4;font-weight:700">자주 가고 싶은 가게를<br>알려 주세요</h2>
<p style="flex:none;margin:8px 0 0;font-size:14px;line-height:1.55;color:#4E5968">추천해 주신 가게에 입점을 제안해 볼게요.</p>

<label style="flex:none;margin-top:24px;display:flex;flex-direction:column;gap:8px">
<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">추천할 가게 내용</span>
<textarea maxlength="1000" placeholder="동네(동), 가게 이름, 어떤 가게인지 적어 주세요" style="height:140px;box-sizing:border-box;border:1.5px solid transparent;border-radius:16px;background:#F2F4F6;padding:16px;font-family:inherit;font-size:15px;line-height:1.6;color:#191F28;outline:none;resize:none"></textarea>
<span style="align-self:flex-end;font-size:12px;color:#636D7A;font-variant-numeric:tabular-nums">0/1000</span>
</label>

<div style="flex:none;display:flex;align-items:center;gap:12px">
<button type="button" aria-label="사진 추가, 3장 중 0장 올림" style="flex:none;width:80px;height:80px;border:0;border-radius:16px;background:#F2F4F6;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:inherit;color:#4E5968;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span style="font-size:12px;color:#636D7A;font-variant-numeric:tabular-nums">0/3</span></button>
<span style="font-size:13px;line-height:1.5;color:#636D7A">가게 간판이나 메뉴판 사진이 있으면 함께 올려 주세요</span>
</div>

<section aria-labelledby="my-rec" style="flex:none;margin-top:32px;display:flex;flex-direction:column;gap:8px">
<h2 id="my-rec" style="margin:0 0 4px;font-size:15px;font-weight:700">내가 추천한 가게</h2>
<div style="background:#F2F4F6;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px">
<span style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:500;color:#2C7445;background:#ECF7EF;border-radius:6px;padding:2px 7px">답변 완료</span><span style="font-size:12px;color:#636D7A;font-variant-numeric:tabular-nums">2026.10.25</span></span>
<p style="margin:0;font-size:15px;line-height:1.5">행복구청역 1번 출구 근처 행복분식을 추천해요</p>
</div>
<div style="background:#F2F4F6;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px">
<span style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:500;color:#4E5968;background:#FFFFFF;border-radius:6px;padding:2px 7px">답변 대기</span><span style="font-size:12px;color:#636D7A;font-variant-numeric:tabular-nums">2026.10.26</span></span>
<p style="margin:0;font-size:15px;line-height:1.5">행복동 꽃집도 즐겨찾는 가게에서 만나고 싶어요</p>
</div>
</section>

</main>

<div style="flex:none;padding:12px 20px 34px;background:#FFFFFF">
<button type="button" style="height:56px;width:100%;border:0;border-radius:16px;background:#DA2F2E;color:#FFFFFF;font-family:inherit;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer">추천하기</button>
</div>
</div>
</body>
</html>
