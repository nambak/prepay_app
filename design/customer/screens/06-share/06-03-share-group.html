<body>
<div style="width:390px;height:1100px;box-sizing:border-box;background:#FFFFFF;font-family:'Noto Sans KR',sans-serif;color:#191F28;display:flex;flex-direction:column;overflow:hidden;position:relative">

<header style="flex:none;height:56px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 4px">

<span style="display:flex;align-items:center;gap:2px;font-size:13px;color:#636D7A">공유할 수 있는 캐시<button type="button" aria-label="공유 가능 캐시 설명 보기" style="width:28px;height:28px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;color:#8B95A1;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8h.01"/></svg></button></span>
</div>
<span style="flex:none;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums">150,000 캐시</span>
</section>

<div role="group" aria-label="받는 대상" style="margin:20px 20px 0;display:flex;background:#F2F4F6;border-radius:12px;padding:4px">
<a href="06-01-share-form.html" style="flex:1;height:40px;border-radius:9px;background:transparent;font-size:15px;font-weight:500;color:#4E5968;display:flex;align-items:center;justify-content:center">개인에게</a>
<button type="button" aria-pressed="true" style="flex:1;height:40px;border:0;border-radius:9px;background:#FFFFFF;font-family:inherit;font-size:15px;font-weight:700;color:#191F28;cursor:pointer">그룹에</button>
</div>

<h2 style="margin:0;padding:28px 20px 16px;font-size:22px;line-height:1.4;font-weight:700">어느 그룹에 보낼까요?</h2>

<fieldset style="margin:0;border:0;padding:0 20px;display:flex;flex-direction:column;gap:8px">

<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<span style="font-size:16px;font-weight:700">우리 팀</span>
<span style="font-size:13px;color:#636D7A">회사/팀 · 7명</span>
</span>

</label>
<label style="box-sizing:border-box;background:#F2F4F6;border:2px solid transparent;border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer">

<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<span style="font-size:16px;font-weight:700">우리 가족</span>
<span style="font-size:13px;color:#636D7A">가족 · 3명</span>
</span>
<input type="radio" name="group" style="flex:none;width:22px;height:22px;margin:0;accent-color:#191F28">
</label>
<label style="box-sizing:border-box;background:#F2F4F6;border:2px solid transparent;border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer">

<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<span style="font-size:16px;font-weight:700">동네 친구들</span>
<span style="font-size:13px;color:#636D7A">친구 · 4명</span>
</span>
<input type="radio" name="group" style="flex:none;width:22px;height:22px;margin:0;accent-color:#191F28">

<section aria-labelledby="amt-t" style="padding:32px 20px 0;display:flex;flex-direction:column">

<input type="text" inputmode="numeric" value="50,000" style="flex:1;min-width:0;border:0;background:transparent;padding:0;font-family:inherit;font-size:28px;font-weight:700;letter-spacing:-0.5px;color:#191F28;outline:none;font-variant-numeric:tabular-nums">
<span style="font-size:18px;font-weight:700">캐시</span>
</label>
<div role="group" aria-label="금액 빠르게 더하기" style="display:flex;gap:8px;margin-top:16px">
<button type="button" style="height:36px;border:0;border-radius:18px;background:#F2F4F6;padding:0 14px;font-family:inherit;font-size:14px;font-weight:500;color:#191F28;cursor:pointer">+1만</button>
<button type="button" style="height:36px;border:0;border-radius:18px;background:#F2F4F6;padding:0 14px;font-family:inherit;font-size:14px;font-weight:500;color:#191F28;cursor:pointer">+5만</button>
<button type="button" style="height:36px;border:0;border-radius:18px;background:#F2F4F6;padding:0 14px;font-family:inherit;font-size:14px;font-weight:500;color:#191F28;cursor:pointer">전액</button>

<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;font-size:13px">

<span style="font-weight:700;font-variant-numeric:tabular-nums">150,000 캐시</span>
</div>
</section>

<section aria-label="메시지 카드와 동의" style="margin-top:24px;padding:0 20px;display:flex;flex-direction:column">

<div style="display:flex;flex-direction:column;gap:2px">
<span style="font-size:15px">메시지 카드 함께 보내기</span>

</div>
<button type="button" aria-pressed="false" aria-label="메시지 카드 함께 보내기" style="flex:none;width:48px;height:28px;border-radius:14px;border:0;background:#D1D6DB;padding:3px;display:flex;justify-content:flex-start;cursor:pointer"><span style="width:22px;height:22px;border-radius:11px;background:#FFFFFF;display:block"></span></button>

<ul style="margin:16px 0 0;background:#F2F4F6;border-radius:16px;padding:14px 14px 14px 30px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.5;color:#4E5968">

</ul>
<div style="margin-top:16px;border-top:1px solid #F2F4F6;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px">
<label style="flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px;line-height:1.45"><input type="checkbox" checked style="flex:none;width:22px;height:22px;margin:0;accent-color:#191F28">보낼 캐시와 유의사항을 확인했어요 (필수)</label>
<a href="#" style="flex:none;font-size:14px;color:#636D7A;text-decoration:underline">유의사항 보기</a>
</div>
</section>
