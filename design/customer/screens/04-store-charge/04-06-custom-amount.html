<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>04-06 원하는 금액 충전 · prepay-app</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<link rel="stylesheet" href="../../assets/preview.css">
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;font-family:'Noto Sans KR',sans-serif;color:#191F28;display:flex;flex-direction:column;overflow:hidden;position:relative">

<header style="flex:none;height:56px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 4px">
<a href="04-05-charge-sheet.html" aria-label="뒤로 가기" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#191F28"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="position:absolute;left:60px;right:60px;margin:0;text-align:center;font-size:17px;font-weight:700">원하는 금액으로 충전</h1>
<span style="width:44px;height:44px;display:block"></span>
</header>

<main style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column">
<h2 style="margin:0;padding:8px 20px 4px;font-size:24px;line-height:1.4;font-weight:700">얼마를 충전할까요?</h2>
<span style="padding:0 20px;font-size:14px;color:#4E5968">하루카페 강남점 · 카페</span>

<div style="padding:28px 20px 0;display:flex;flex-direction:column;gap:16px">
<label style="display:flex;align-items:baseline;gap:6px;border-bottom:2px solid #191F28;padding-bottom:8px">
<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">결제 금액</span>
<input type="text" inputmode="numeric" value="100,000" style="flex:1;min-width:0;width:100%;border:0;background:transparent;padding:0;font-family:inherit;font-size:32px;font-weight:700;letter-spacing:-0.8px;color:#191F28;outline:none;font-variant-numeric:tabular-nums">
<span style="flex:none;font-size:24px;font-weight:700">원</span>
</label>
<div style="display:flex;gap:8px">
<button type="button" style="height:36px;border:0;border-radius:18px;padding:0 14px;background:#F2F4F6;color:#191F28;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer">+1만</button>
<button type="button" style="height:36px;border:0;border-radius:18px;padding:0 14px;background:#F2F4F6;color:#191F28;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer">+5만</button>
<button type="button" style="height:36px;border:0;border-radius:18px;padding:0 14px;background:#F2F4F6;color:#191F28;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer">+10만</button>
</div>
</div>

<section aria-label="충전 결과" style="margin:28px 20px 0;background:#F2F4F6;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;justify-content:space-between">
<span style="font-size:14px;color:#4E5968">충전 포인트</span>
<span style="font-size:20px;font-weight:700;letter-spacing:-0.4px;font-variant-numeric:tabular-nums">105,000P</span>
</div>
<div style="display:flex;align-items:center;justify-content:space-between">
<span style="font-size:14px;color:#4E5968">결제 금액</span>
<span style="font-size:15px;font-weight:500;font-variant-numeric:tabular-nums">100,000원</span>
</div>
<div style="display:flex;justify-content:flex-end"><span style="font-size:12px;font-weight:500;color:#2C7445;background:#ECF7EF;border-radius:6px;padding:2px 7px">+5% 더 충전</span></div>
</section>

<section aria-labelledby="policy-t" style="margin:12px 20px 0;background:#FFF4E6;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:center;gap:6px;color:#A35A00">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8h.01"/></svg>
<h3 id="policy-t" style="margin:0;font-size:14px;font-weight:700">충전 기준</h3>
</div>
<ul style="margin:0;padding:0 0 0 24px;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:1.55;color:#4E5968">
<li>원하는 금액으로 충전하면 결제 금액의 5%를 더 충전해 드려요.</li>
<li>FOOD 업종: 5만 원부터 · 할인율 5% 이상</li>
<li>LIFE 업종: 10만 원부터 · 할인율 5% 이상</li>
</ul>
</section>
</main>

<div style="flex:none;padding:12px 20px 34px;background:#FFFFFF">
<a href="04-07-checkout.html" style="height:56px;border-radius:16px;background:#DA2F2E;color:#FFFFFF;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums">100,000원 결제하기</a>
</div>
</div>
</body>
</html>
