<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>05-07 프랜차이즈 지점 선택 · prepay-app</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<link rel="stylesheet" href="../../assets/preview.css">
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F2F4F6;font-family:'Noto Sans KR',sans-serif;color:#191F28;display:flex;flex-direction:column;overflow:hidden;position:relative">

<header style="flex:none;height:56px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 4px">
<a href="05-01-wallet.html" aria-label="뒤로 가기" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#191F28"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="position:absolute;left:60px;right:60px;margin:0;text-align:center;font-size:17px;font-weight:700">이용할 지점 선택</h1>
<span style="width:44px;height:44px;display:block"></span>
</header>

<main style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:8px 0 24px">
<section aria-label="브랜드 정보" style="margin:0 16px;background:#FFFFFF;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;align-items:center;gap:12px">
<div style="flex:none;width:48px;height:48px;border-radius:14px;background:#ECF7EF;color:#2C7445;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 004 0V3M7 11v10"/><path d="M17 3c-2 1.5-3 4-3 7h3v11"/></svg></div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<h2 style="margin:0;font-size:17px;font-weight:700">행복샌드위치</h2>
<span style="font-size:13px;color:#636D7A">프랜차이즈 · 13번째 이용</span>
</div>
</div>
<div style="display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #F2F4F6;padding-top:16px">
<span style="font-size:13px;color:#4E5968">쓸 수 있는 캐시</span>
<span style="font-size:18px;font-weight:700;letter-spacing:-0.3px;font-variant-numeric:tabular-nums">120,000 캐시</span>
</div>
<div style="display:flex;flex-direction:column;gap:10px;font-size:14px;margin-top:-4px">
<div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:4px;background:#EE3E3D;display:block"></span><span style="flex:1;color:#4E5968">충전캐시</span><span style="font-weight:500;font-variant-numeric:tabular-nums">100,000</span></div>
<div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:4px;background:#F2A14A;display:block"></span><span style="flex:1;color:#4E5968">서비스캐시</span><span style="font-weight:500;font-variant-numeric:tabular-nums">20,000</span></div>
</div>
</section>
<p style="margin:0;padding:12px 20px 0;font-size:13px;line-height:1.5;color:#636D7A">충전한 캐시는 같은 브랜드의 모든 지점에서 쓸 수 있어요</p>

<div style="display:flex;justify-content:space-between;align-items:center;padding:24px 20px 8px">
<h2 style="margin:0;font-size:18px;font-weight:700">지점 3곳</h2>
<button type="button" style="height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;gap:2px;font-family:inherit;font-size:14px;color:#4E5968;cursor:pointer">가까운 순<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
</div>

<fieldset style="margin:0 16px;border:0;padding:0 20px;background:#FFFFFF;border-radius:24px;display:flex;flex-direction:column">
<legend style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">이용할 지점</legend>
<label style="height:76px;display:flex;align-items:center;gap:12px;cursor:pointer">
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
<span style="font-size:16px;font-weight:700">행복샌드위치 중앙점</span>
<span style="font-size:13px;color:#636D7A">서울시 행복구 하늘동 · 88m</span>
</span>
<input type="radio" name="branch" checked style="flex:none;width:22px;height:22px;margin:0;accent-color:#191F28">
</label>
<label style="height:76px;display:flex;align-items:center;gap:12px;border-top:1px solid #F2F4F6;cursor:pointer">
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
<span style="font-size:16px;font-weight:500">행복샌드위치 역전점</span>
<span style="font-size:13px;color:#636D7A">서울시 행복구 행복동 · 450m</span>
</span>
<input type="radio" name="branch" style="flex:none;width:22px;height:22px;margin:0;accent-color:#191F28">
</label>
<label style="height:76px;display:flex;align-items:center;gap:12px;border-top:1px solid #F2F4F6;cursor:pointer">
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
<span style="font-size:16px;font-weight:500">행복샌드위치 가게점</span>
<span style="font-size:13px;color:#636D7A">서울시 행복구 사랑동 · 1.2km</span>
</span>
<input type="radio" name="branch" style="flex:none;width:22px;height:22px;margin:0;accent-color:#191F28">
</label>
</fieldset>

<div style="margin:12px 16px 0;padding:14px 16px;background:#FFFFFF;border-radius:16px;display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5;color:#4E5968">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#636D7A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8h.01"/></svg>
<span>지점마다 메뉴와 가격이 다를 수 있어요. 쓰기 전에 이용할 지점을 꼭 확인해 주세요.</span>
</div>
</main>

<div style="flex:none;padding:12px 20px 34px;background:#F2F4F6">
<a href="05-03-pay-sheet.html" style="height:56px;border-radius:16px;background:#DA2F2E;color:#FFFFFF;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center">중앙점에서 쓰기</a>
</div>
</div>
</body>
</html>
