<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>07-04 결제 상세 · prepay-app</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<link rel="stylesheet" href="../../assets/preview.css">
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F2F4F6;font-family:'Noto Sans KR',sans-serif;color:#191F28;display:flex;flex-direction:column;overflow:hidden;position:relative">

<header style="flex:none;height:56px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 4px">
<a href="07-01-history.html" aria-label="뒤로 가기" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#191F28"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="position:absolute;left:60px;right:60px;margin:0;text-align:center;font-size:17px;font-weight:700">결제 상세</h1>
<span style="width:44px;height:44px;display:block"></span>
</header>

<main style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding-bottom:16px">

<div style="padding:8px 20px 8px;display:flex;flex-direction:column;gap:2px">
<h2 style="margin:0;font-size:22px;line-height:30px;font-weight:700;letter-spacing:-0.3px">행복식당 1</h2>
<span style="font-size:14px;line-height:20px;color:#636D7A;font-variant-numeric:tabular-nums">주문 12345678</span>
<div style="display:flex;gap:4px;margin-top:10px">
<span style="font-size:12px;line-height:18px;font-weight:500;color:#2C7445;background:#ECF7EF;border-radius:6px;padding:2px 7px">결제 완료</span>
<span style="font-size:12px;line-height:18px;font-weight:500;color:#C42726;background:#FFF0F0;border-radius:6px;padding:2px 7px">취소 가능</span>
</div>
</div>

<section aria-labelledby="pay-info-t" style="margin:0 16px;background:#FFFFFF;border-radius:24px;padding:20px 20px 4px;display:flex;flex-direction:column">
<h3 id="pay-info-t" style="margin:0 0 16px;font-size:15px;line-height:22px;font-weight:700">결제 정보</h3>
<div style="display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:22px">
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:#636D7A">충전 포인트</span><span style="font-size:15px;font-variant-numeric:tabular-nums">50,000P</span></div>
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:#636D7A">상품 금액</span><span style="font-size:15px;font-variant-numeric:tabular-nums">50,000원</span></div>
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:#636D7A">할인 금액</span><span style="font-size:15px;font-variant-numeric:tabular-nums">−10,000원</span></div>
<span aria-hidden="true" style="height:1px;background:#F2F4F6;display:block"></span>
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:500;color:#191F28">최종 결제 금액</span><span style="font-size:20px;line-height:28px;font-weight:700;letter-spacing:-0.4px;font-variant-numeric:tabular-nums">40,000원</span></div>
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:#636D7A">결제 일시</span><span style="font-variant-numeric:tabular-nums">2026.10.13 12:00</span></div>
</div>
<a href="#" style="margin-top:16px;height:52px;border-top:1px solid #F2F4F6;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:500;color:#191F28">카드 결제 내역 자세히 보기<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B95A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
</section>

<section aria-labelledby="charged-t" style="margin:0 16px;background:#FFFFFF;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px">
<h3 id="charged-t" style="margin:0;font-size:15px;line-height:22px;font-weight:700">이 결제로 충전한 포인트</h3>
<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:14px;line-height:22px"><span style="display:flex;align-items:center;gap:8px;color:#636D7A"><span style="width:8px;height:8px;border-radius:4px;background:#EE3E3D;display:block"></span>남은 포인트</span><span style="font-size:15px;font-weight:500;font-variant-numeric:tabular-nums">50,000P</span></div>
<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:14px;line-height:22px"><span style="padding-left:16px;color:#636D7A">쓴 포인트</span><span style="font-size:15px;font-variant-numeric:tabular-nums">0P</span></div>
</section>

<div style="margin:0 16px;background:#FFFFFF;border-radius:16px;padding:14px 16px;display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.55;color:#4E5968">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B95A1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8h.01"/></svg>
<p style="margin:0">결제일로부터 1일 안에, 이 결제로 충전한 포인트를 쓰기 전이면 결제를 취소할 수 있어요.</p>
</div>

</main>

<div style="flex:none;padding:12px 20px 34px;background:#FFFFFF;display:flex;gap:8px">
<button type="button" style="flex:1;height:56px;border-radius:16px;background:#F2F4F6;color:#191F28;font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:center;border:0;font-family:inherit;cursor:pointer">결제 취소하기</button>
<a href="07-01-history.html" style="flex:2;height:56px;border-radius:16px;background:#DA2F2E;color:#FFFFFF;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center">확인</a>
</div>

</div>
</body>
</html>
