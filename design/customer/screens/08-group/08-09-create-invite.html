<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>08-09 그룹 만들기 · 초대 · prepay-app</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<link rel="stylesheet" href="../../assets/preview.css">
</head>
<body>
<div style="width:390px;height:1100px;box-sizing:border-box;background:#FFFFFF;font-family:'Noto Sans KR',sans-serif;color:#191F28;display:flex;flex-direction:column;overflow:hidden;position:relative">

<header style="flex:none;height:56px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 4px">
<a href="08-08-create-relation.html" aria-label="뒤로 가기" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#191F28"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="position:absolute;left:60px;right:60px;margin:0;text-align:center;font-size:17px;font-weight:700">그룹 만들기</h1>
<span style="width:44px;height:44px;display:block"></span>
</header>

<main style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column">

<div style="padding:8px 20px 16px;display:flex;flex-direction:column;gap:8px">
<div aria-hidden="true" style="display:flex;gap:4px">
<span style="flex:1;height:4px;border-radius:2px;background:#191F28;display:block"></span>
<span style="flex:1;height:4px;border-radius:2px;background:#191F28;display:block"></span>
<span style="flex:1;height:4px;border-radius:2px;background:#191F28;display:block"></span>
</div>
<span style="font-size:13px;font-weight:500;color:#636D7A"><b style="color:#191F28;font-weight:700">3</b>/3 그룹원 초대</span>
</div>

<h2 style="margin:0;padding:8px 20px 20px;font-size:24px;line-height:1.4;font-weight:700">함께할 그룹원을<br>초대해 주세요</h2>

<div style="padding:0 20px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;flex-direction:column;gap:8px">
<label for="inv-phone" style="font-size:14px;font-weight:500;color:#4E5968">연락처</label>
<div style="height:52px;box-sizing:border-box;border:1.5px solid transparent;border-radius:14px;background:#F2F4F6;padding:0 6px 0 16px;display:flex;align-items:center;gap:8px">
<input id="inv-phone" type="tel" placeholder="전화번호 전체 또는 뒤 4자리" style="flex:1;min-width:0;border:0;background:transparent;font-family:inherit;font-size:16px;color:#191F28;outline:none">
<button type="button" style="flex:none;height:40px;border:0;border-radius:10px;background:#191F28;padding:0 14px;font-family:inherit;font-size:14px;font-weight:500;color:#FFFFFF;cursor:pointer">연락처 불러오기</button>
</div>
</div>
<label style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:14px;font-weight:500;color:#4E5968">이름</span>
<input type="text" placeholder="뒤 4자리로 찾을 때 입력해 주세요" style="height:52px;box-sizing:border-box;border:1.5px solid transparent;border-radius:14px;background:#F2F4F6;padding:0 16px;font-family:inherit;font-size:16px;color:#191F28;outline:none">
</label>
<button type="button" style="height:48px;border:0;border-radius:14px;background:#F2F4F6;font-family:inherit;font-size:15px;font-weight:500;color:#191F28;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>회원 찾기</button>
</div>

<ul aria-label="선택한 그룹원" style="list-style:none;margin:0;padding:16px 20px 0;display:flex;flex-wrap:wrap;gap:8px">
<li style="height:36px;box-sizing:border-box;border-radius:18px;background:#191F28;color:#FFFFFF;padding:0 4px 0 14px;display:flex;align-items:center;gap:2px;font-size:14px;font-weight:500">박*준<button type="button" aria-label="박*준 선택 빼기" style="width:28px;height:28px;border:0;border-radius:14px;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;color:#FFFFFF;cursor:pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></li>
<li style="height:36px;box-sizing:border-box;border-radius:18px;background:#191F28;color:#FFFFFF;padding:0 4px 0 14px;display:flex;align-items:center;gap:2px;font-size:14px;font-weight:500">이*윤<button type="button" aria-label="이*윤 선택 빼기" style="width:28px;height:28px;border:0;border-radius:14px;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;color:#FFFFFF;cursor:pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></li>
</ul>

<section aria-labelledby="found-t" style="display:flex;flex-direction:column">
<h3 id="found-t" style="margin:0;padding:20px 20px 4px;font-size:14px;font-weight:500;color:#636D7A">찾은 회원 4명</h3>
<div style="padding:0 20px;display:flex;flex-direction:column">
<label style="height:56px;display:flex;align-items:center;gap:12px;cursor:pointer">
<input type="checkbox" checked style="flex:none;width:22px;height:22px;margin:0;accent-color:#191F28">
<span aria-hidden="true" style="flex:none;width:36px;height:36px;border-radius:18px;background:#F2F4F6;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#4E5968">박</span>
<span style="flex:1;min-width:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px"><span style="font-size:15px;font-weight:500">박*준</span><span style="font-size:13px;color:#636D7A;font-variant-numeric:tabular-nums">010-****-2222</span></span>
</label>
<label style="height:56px;display:flex;align-items:center;gap:12px;cursor:pointer;border-top:1px solid #F2F4F6">
<input type="checkbox" checked style="flex:none;width:22px;height:22px;margin:0;accent-color:#191F28">
<span aria-hidden="true" style="flex:none;width:36px;height:36px;border-radius:18px;background:#F2F4F6;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#4E5968">이</span>
<span style="flex:1;min-width:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px"><span style="font-size:15px;font-weight:500">이*윤</span><span style="font-size:13px;color:#636D7A;font-variant-numeric:tabular-nums">010-****-4444</span></span>
</label>
<label style="height:56px;display:flex;align-items:center;gap:12px;cursor:pointer;border-top:1px solid #F2F4F6">
<input type="checkbox" style="flex:none;width:22px;height:22px;margin:0;accent-color:#191F28">
<span aria-hidden="true" style="flex:none;width:36px;height:36px;border-radius:18px;background:#F2F4F6;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#4E5968">최</span>
<span style="flex:1;min-width:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px"><span style="font-size:15px;font-weight:500">최*은</span><span style="font-size:13px;color:#636D7A;font-variant-numeric:tabular-nums">010-****-6666</span></span>
</label>
<label style="height:56px;display:flex;align-items:center;gap:12px;cursor:pointer;border-top:1px solid #F2F4F6">
<input type="checkbox" style="flex:none;width:22px;height:22px;margin:0;accent-color:#191F28">
<span aria-hidden="true" style="flex:none;width:36px;height:36px;border-radius:18px;background:#F2F4F6;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#4E5968">한</span>
<span style="flex:1;min-width:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px"><span style="font-size:15px;font-weight:500">한*우</span><span style="font-size:13px;color:#636D7A;font-variant-numeric:tabular-nums">010-****-8888</span></span>
</label>
</div>
</section>

<section aria-label="초대 메시지" style="margin:12px 20px 0;border-top:1px solid #E5E8EB;padding-top:8px;display:flex;flex-direction:column">
<div style="height:52px;display:flex;align-items:center;gap:12px">
<span id="t-card" style="flex:1;font-size:16px;font-weight:500">초대 메시지 카드 보내기</span>
<button type="button" aria-pressed="true" aria-labelledby="t-card" style="flex:none;width:48px;height:28px;border-radius:14px;border:0;background:#191F28;padding:3px;display:flex;justify-content:flex-end;cursor:pointer"><span style="width:22px;height:22px;border-radius:11px;background:#FFFFFF;display:block"></span></button>
</div>
<label style="box-sizing:border-box;border-radius:14px;background:#F2F4F6;padding:14px 16px;display:flex;flex-direction:column;gap:4px">
<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">초대 메시지</span>
<textarea maxlength="100" rows="2" style="height:48px;border:0;background:transparent;padding:0;resize:none;font-family:inherit;font-size:15px;line-height:1.55;color:#191F28;outline:none">우리 그룹에서 같이 써요!</textarea>
<span style="align-self:flex-end;font-size:13px;color:#636D7A;font-variant-numeric:tabular-nums">14/100</span>
</label>
</section>

<div style="margin:8px 20px 0;display:flex;align-items:center;gap:8px">
<label style="flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px"><input type="checkbox" checked style="flex:none;width:22px;height:22px;margin:0;accent-color:#191F28">그룹 내용과 유의사항을 확인했어요 (필수)</label>
<a href="#" style="flex:none;font-size:14px;color:#636D7A;text-decoration:underline">유의사항 보기</a>
</div>
</main>

<div style="flex:none;padding:12px 20px 34px;background:#FFFFFF">
<a href="08-10-create-done.html" style="height:56px;border-radius:16px;background:#DA2F2E;color:#FFFFFF;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center">2명 초대하고 그룹 만들기</a>
</div>
</div>
</body>
</html>
